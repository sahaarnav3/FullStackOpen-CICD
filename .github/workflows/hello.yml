name: Github Actions 1 (Hello World!)

on:
  push:
    branches:
      - main

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello World!"
      - name: "Run date"
        run: date --date="now"
      - name: "Run ls -l"
        run: ls -l
