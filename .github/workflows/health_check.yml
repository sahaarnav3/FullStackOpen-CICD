name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    # Runs every 24 hours at 12:00 UTC
    - cron: "0 12 * * *"

jobs:
  periodic_ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed application health
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://fullstackopen-cicd.fly.dev/
          max-attempts: 3
          retry-delay: 5s
